name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1

      - name: Install xcodegen
        run: brew install xcodegen

      # PICORUBY_REF is a branch, so key the caches on the commit it points
      # at right now — a cache hit means vendor/ and build/ already match it.
      - name: Resolve picoruby ref
        id: picoruby
        run: echo "sha=$(git ls-remote https://github.com/bash0C7/picoruby.git port-darwin | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache vendor/picoruby
        uses: actions/cache@v6
        with:
          path: vendor/picoruby
          key: picoruby-${{ steps.picoruby.outputs.sha }}

      - name: Cache build output
        uses: actions/cache@v6
        with:
          path: |
            build/host
            build/ios-repl-sim
          key: build-${{ steps.picoruby.outputs.sha }}-${{ hashFiles('build_config/**', 'bridge/**', 'examples/ios/repl/aot-kernel/**', '.github/aot-pins.yml', 'rakelib/aot.rake', 'Rakefile') }}

      # Host-only: the bridge smoke test plus every example's standalone
      # test_*.rb. Seconds of runtime, so it belongs on every PR. The full
      # per-example device+Simulator sweep is .github/workflows/regression.yml,
      # which is far too slow to gate a PR and runs on a schedule instead.
      - name: Unit tests + bridge smoke test (host build)
        run: rake regress:unit

      # Every AOT kernel (examples/ios/*/aot-kernel/*.rb) is regenerated from
      # source against the spinel/suppify commits pinned in .github/aot-pins.yml
      # — the generated picoruby-<kernel>/ gem is a build product, not
      # committed. `rake aot:refresh` is the single source of truth for this
      # pipeline (clone+build spinel, checkout suppify, regenerate every
      # kernel, Simulator-build every example that has one); see rakelib/aot.rake.
      - name: Load AOT pins
        id: aotpins
        run: |
          ruby -ryaml -e '
            pins = YAML.load_file(".github/aot-pins.yml")
            File.open(ENV["GITHUB_OUTPUT"], "a") { |f| f.puts "spinel=#{pins["spinel"]}" }
          '

      - name: Cache spinel build
        uses: actions/cache@v6
        with:
          path: build/aot/spinel
          key: spinel-${{ steps.aotpins.outputs.spinel }}

      - name: AOT pin refresh (regenerate kernels, Simulator build)
        run: rake aot:refresh
