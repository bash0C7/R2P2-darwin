name: PicoRubyRunner
options:
  bundleIdPrefix: com.bash0c7.picoruby
  deploymentTarget:
    iOS: "26.0"   # Liquid Glass (SwiftUI .glass / .glassProminent, glassEffect) — no availability shims
packages:
  # The Darwin (Metal) GPU backend for picoruby-gpu_bench. Its pgpu_bench_*
  # C symbols resolve the undefined references in the staged libmruby.a at
  # app link — same convention as PicoTorchDarwin in the torch example.
  PicoGPUBenchDarwin:
    path: picoruby-gpu_bench/ports/darwin/ext
targets:
  PicoRubyRunner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../../../bridge
        includes:
          - "picoruby_bridge.c"
          - "picoruby_bridge.h"
          - "task_hal_ios.c"
    dependencies:
      # Dynamic Swift-package product: link AND embed so dyld can resolve
      # the pgpu_bench_* symbols (the framework lands in the app's Frameworks/).
      - package: PicoGPUBenchDarwin
        embed: true
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PicoRubyRunner-Bridging-Header.h
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "PICORB_ALLOC_ESTALLOC"
          - "PICORB_ALLOC_ALIGN=8"
          - "MRB_NO_BOXING"
          - "MRB_INT64"
          - "MRB_UTF8_STRING"
          - "PICORB_PLATFORM_POSIX"
          - "PICORB_PLATFORM_DARWIN"
          - "MRB_TICK_UNIT=4"
          - "MRB_TIMESLICE_TICK_COUNT=3"
          - "MRB_USE_TASK_SCHEDULER=1"
          - "MRB_USE_VM_SWITCH_DISPATCH=1"
          - "MRB_BASELINE_PROFILE=1"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../../vendor/picoruby/include"
          - "$(SRCROOT)/../../../vendor/picoruby/mrbgems/mruby-compiler/include"
          - "$(SRCROOT)/../../../vendor/picoruby/mrbgems/mruby-compiler/lib/prism/include"
          - "$(SRCROOT)/../../../vendor/picoruby/mrbgems/picoruby-mruby/lib/mruby/include"
          - "$(SRCROOT)/../../../vendor/picoruby/mrbgems/picoruby-mruby/include"
          # Both build dirs: mruby generates mruby/presym/id.h into the build
          # dir of whichever config produced the archive being linked, so a
          # device build that only knows the Simulator dir compiles solely
          # because a Simulator build happened to run first on that machine.
          - "$(SRCROOT)/../../../build/ios-repl-sim/include"
          - "$(SRCROOT)/../../../build/ios-repl-device/include"
          - "$(SRCROOT)/../../../vendor/picoruby/mrbgems/picoruby-mruby/lib/mruby/mrbgems/mruby-task/include"
          - "$(SRCROOT)/../../../bridge"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/lib"
        OTHER_LDFLAGS:
          - "-lmruby"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"   # launch screen => full-screen layout (no letterbox)
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.bash0c7.picoruby.PicoRubyRunner
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SM5792D355  # this account's Apple Team ID (Xcode > Settings > Accounts)
